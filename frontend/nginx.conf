# Serves the static production build (frontend/Dockerfile.prod) with SPA
# fallback for client-side routing (/, /login, /signup, /app, /app/*) and
# long-lived caching for hashed build assets only — index.html itself must
# stay revalidated on every request since it's the thing that names this
# build's asset hashes.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /og-image.png {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
